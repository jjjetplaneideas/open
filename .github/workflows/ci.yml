name: CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benchmark/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".eslintrc.cjs"
      - "vitest.config.ts"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
